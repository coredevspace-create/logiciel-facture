<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ardoise — Devis &amp; factures</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232962ff'/%3E%3Crect x='10' y='14' width='44' height='32' rx='5' fill='%23131722' stroke='%23fff' stroke-width='3'/%3E%3Cpolyline points='17,38 25,30 31,34 41,23' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpolyline points='35.5,22.5 41.5,22.5 41.5,28.5' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='22' y='50' width='20' height='3.5' rx='1.75' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">

<body>
  <header class="topbar no-print">
    <a class="brand" href="#/tableau">
      <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#2962ff"/>
        <rect x="10" y="14" width="44" height="32" rx="5" fill="#131722" stroke="#fff" stroke-width="3"/>
        <polyline points="17,38 25,30 31,34 41,23" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="35.5,22.5 41.5,22.5 41.5,28.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="22" y="50" width="20" height="3.5" rx="1.75" fill="#fff" opacity=".85"/>
      </svg>
      <span class="brand-name">Ardoise</span>
    </a>
    <nav id="nav">
      <a href="#/tableau" data-route="tableau">Tableau de bord</a>
      <a href="#/devis" data-route="devis">Devis</a>
      <a href="#/factures" data-route="factures">Factures</a>
      <a href="#/clients" data-route="clients">Clients</a>
      <a href="#/catalogue" data-route="catalogue">Catalogue</a>
      <a href="#/parametres" data-route="parametres">Mon entreprise</a>
      <a href="#/sauvegarde" data-route="sauvegarde">Sauvegarde</a>
    </nav>
    <div class="topbar-right">
      <a class="btn primary small" href="#/nouveau/invoice">+ Facture</a>
      <a class="btn small" href="#/nouveau/quote">+ Devis</a>
    </div>
  </header>

  <div id="ticker" class="ticker no-print"></div>
  <div id="banner" class="no-print"></div>
  <main id="main"></main>

  <div id="modal" class="modal no-print" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" data-close aria-label="Fermer">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toasts" class="no-print"></div>

  <!-- Génération PDF / Factur-X (bibliothèques locales, fonctionne sans Internet) -->
  <script src="js/vendor/pdf-lib.min.js"></script>
  <script src="js/vendor/fontkit.umd.min.js"></script>
  <script src="js/vendor/assets.js"></script>
  <script src="js/facturx.js"></script>
  <script src="js/app.js"></script>

</html>
