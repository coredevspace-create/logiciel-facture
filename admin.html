<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ardoise — Espace administrateur</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <style>
    :root {
      --bg: #131722; --panel: #1e222d; --panel-2: #252a37; --hover: #2a2e39; --border: #2a2e39; --border-2: #363a45;
      --text: #d1d4dc; --strong: #fff; --muted: #868b98; --primary: #2962ff; --up: #089981; --down: #f23645; --warn: #ff9800;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif; font-size: 14.5px; line-height: 1.5; }
    a { color: #5b8def; }
    header { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 56px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 9px; color: var(--strong); font-weight: 700; font-size: 17px; text-decoration: none; }
    .brand img { width: 28px; height: 28px; }
    .tag { font-size: 12px; font-weight: 700; color: var(--warn); border: 1px solid rgba(255,152,0,.4); background: rgba(255,152,0,.12); padding: 3px 9px; border-radius: 20px; }
    header .right { margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
    main { max-width: 1060px; margin: 0 auto; padding: 22px 20px 70px; }
    h1 { color: var(--strong); font-size: 22px; margin: 4px 0 16px; }
    h2 { color: var(--strong); font-size: 16px; margin: 0 0 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 14px; }
    label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; margin-bottom: 10px; }
    input, select, textarea { width: 100%; margin-top: 5px; padding: 9px 10px; border: 1px solid var(--border-2); border-radius: 6px; font: inherit; color: var(--strong); background: var(--bg); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
    textarea.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; word-break: break-all; }
    .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--strong); padding: 9px 14px; border-radius: 6px; font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; text-decoration: none; }
    .btn:hover { background: var(--hover); }
    .btn.primary { background: var(--primary); border-color: var(--primary); }
    .btn.success { background: var(--up); border-color: var(--up); }
    .btn.danger { color: var(--down); background: transparent; border-color: rgba(242,54,69,.4); }
    .btn.small { padding: 6px 10px; font-size: 12.5px; }
    .btn:disabled { opacity: .5; cursor: wait; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .muted { color: var(--muted); } .small { font-size: 13px; } .up { color: var(--up); } .warnc { color: var(--warn); } .down { color: var(--down); }
    .note { border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
    .note.info { background: rgba(41,98,255,.14); color: #a9c1ff; }
    .note.warn { background: rgba(255,152,0,.13); color: #ffc070; }
    .note.ok { background: rgba(8,153,129,.14); color: #6fe0c4; }
    .keybox { background: var(--bg); border: 1px dashed #4a5060; border-radius: 6px; padding: 12px; margin: 8px 0; color: var(--strong); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    .table-wrap { overflow-x: auto; }
    .empty { text-align: center; color: var(--muted); padding: 22px; }
    #toast { position: fixed; bottom: 18px; right: 18px; background: var(--panel-2); color: var(--strong); padding: 11px 15px; border-radius: 6px; border-left: 3px solid var(--up); box-shadow: 0 6px 20px rgba(0,0,0,.45); display: none; max-width: 380px; z-index: 9; }
    #toast.error { border-left-color: var(--down); }
    details summary { cursor: pointer; color: var(--strong); font-weight: 600; }
    @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html"><img src="images/logo.svg" alt="">Ardoise</a>
    <span class="tag">Espace administrateur</span>
    <div class="right" id="who"></div>
  </header>
  <main id="main"></main>
  <div id="toast"></div>

  <script src="js/licence-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
