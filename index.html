<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FactuLocal — Devis &amp; Factures</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar no-print">
    <a class="brand" href="#/tableau">
      <span class="brand-logo">F</span>
      <span class="brand-name">FactuLocal</span>
    </a>
    <nav id="nav">
      <a href="#/tableau" data-route="tableau">Tableau de bord</a>
      <a href="#/devis" data-route="devis">Devis</a>
      <a href="#/factures" data-route="factures">Factures</a>
      <a href="#/clients" data-route="clients">Clients</a>
      <a href="#/catalogue" data-route="catalogue">Catalogue</a>
      <a href="#/parametres" data-route="parametres">Mon entreprise</a>
      <a href="#/sauvegarde" data-route="sauvegarde">Sauvegarde</a>
    </nav>
    <div class="topbar-right">
      <a class="btn primary small" href="#/nouveau/invoice">+ Facture</a>
      <a class="btn small" href="#/nouveau/quote">+ Devis</a>
    </div>
  </header>

  <div id="ticker" class="ticker no-print"></div>
  <div id="banner" class="no-print"></div>
  <main id="main"></main>

  <div id="modal" class="modal no-print" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" data-close aria-label="Fermer">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toasts" class="no-print"></div>

  <script src="js/app.js"></script>
</body>
</html>
